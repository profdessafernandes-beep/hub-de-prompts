<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Hub de Prompts</title>
<link rel="stylesheet" href="login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<form class="box" id="form" autocomplete="on" novalidate>
  <div class="logo">✨</div>
  <h1><span>Hub de Prompts</span></h1>
  <p class="sub" id="sub">Entre para acessar seus prompts</p>

  <div id="emailWrap">
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username">
  </div>

  <div id="passWrap">
    <label for="pass" id="passLabel">Senha</label>
    <div class="pass">
      <input type="password" id="pass" autocomplete="current-password">
      <button type="button" class="eye" id="eye" title="Mostrar senha">👁</button>
    </div>
  </div>

  <div id="confirmWrap" class="hidden">
    <label for="pass2">Confirme a senha</label>
    <input type="password" id="pass2" autocomplete="new-password">
  </div>

  <label class="check" id="rememberWrap"><input type="checkbox" id="remember" checked> Manter conectada neste aparelho</label>

  <button class="pri" id="btn" type="submit">Entrar</button>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>

  <div class="links">
    <button type="button" class="link" id="toSignup">Criar conta</button>
    <button type="button" class="link" id="toForgot">Esqueci a senha</button>
    <button type="button" class="link hidden" id="toLogin">← Voltar para entrar</button>
  </div>
</form>

<script src="login.js"></script>
</body>
</html>
